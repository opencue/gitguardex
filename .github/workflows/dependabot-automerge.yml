name: Dependabot auto-merge

# Squash-merge Dependabot patch/minor bumps once CI on the PR head is green.
# `main` has no required status checks, so `gh pr merge --auto` would merge
# immediately; this waits for a successful CI run on the exact head SHA instead.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge patch/minor bump if CI passed on the current head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number,title,author,headRefOid --jq '.[0] // empty')"
          if [ -z "$pr_json" ]; then echo "no open PR for $HEAD_BRANCH"; exit 0; fi
          number="$(jq -r .number <<<"$pr_json")"
          title="$(jq -r .title <<<"$pr_json")"
          author="$(jq -r .author.login <<<"$pr_json")"
          current_sha="$(jq -r .headRefOid <<<"$pr_json")"
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "PR #$number is not authored by Dependabot ($author); skipping"; exit 0
          fi
          if [ "$current_sha" != "$HEAD_SHA" ]; then
            echo "PR #$number head moved ($HEAD_SHA -> $current_sha); the next CI run decides"; exit 0
          fi
          # Titles look like "chore(deps): bump X from 1.2.3 to 1.3.0 [in /dir]".
          from="$(sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\1/p' <<<"$title")"
          to="$(sed -nE 's/.* from v?([0-9]+)\..* to v?([0-9]+)\..*/\2/p' <<<"$title")"
          if [ -z "$from" ] || [ -z "$to" ]; then
            echo "PR #$number: cannot parse versions from '$title'; leaving for a human"; exit 0
          fi
          if [ "$from" != "$to" ]; then
            echo "PR #$number is a major bump ($from -> $to); leaving for a human"; exit 0
          fi
          gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
