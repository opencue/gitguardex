name: Release to npm (provenance + signed assets)

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-release
  queue: max

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.repository == 'opencue/gitguardex' && (github.ref == 'refs/heads/main' || (github.event_name == 'release' && github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # npm run verify compares new files with origin/main.
          persist-credentials: false

      - name: Verify release source
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify npm trusted-publishing support
        run: |
          npm_version="$(npm --version)"
          node - "$npm_version" <<'NODE'
          const version = process.argv[2];
          const [major = 0, minor = 0, patch = 0] = version.split('.').map(Number);
          const supported = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!supported) {
            console.error(`npm ${version} cannot use OIDC trusted publishing; requires npm >=11.5.1`);
            process.exit(1);
          }
          NODE

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install
        run: npm ci --ignore-scripts

      - name: Verify
        run: npm run verify

      - name: Audit dependencies
        run: scripts/npm-audit-retry.sh --audit-level=high

      - name: Check that main is still current
        id: source
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          if [[ "$RELEASE_EVENT" != release ]]; then
            main="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
            if [[ "$GITHUB_SHA" != "$main" ]]; then
              echo "A newer main commit supersedes this run."
              exit 0
            fi
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Resolve package metadata
        id: pkg
        if: steps.source.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/resolve-npm-release.js

      - name: Reject a conflicting GitHub tag before publishing
        if: steps.source.outputs.eligible == 'true'
        env:
          RELEASE_TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_sha="$(awk 'END {print $1}' <<< "$refs")"
          [[ -z "$tag_sha" || "$tag_sha" == "$GITHUB_SHA" ]]

      - name: Pack release tarball
        id: pack
        if: steps.source.outputs.eligible == 'true'
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          PACKAGE_VERSION: ${{ steps.pkg.outputs.version }}
          PACKAGE_PUBLISHED: ${{ steps.pkg.outputs.published }}
        run: |
          mkdir -p dist
          if [[ "$PACKAGE_PUBLISHED" == true ]]; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already on npm; skipping publish."
            package_file="$(npm pack "$PACKAGE_NAME@$PACKAGE_VERSION" --pack-destination dist)"
          else
            npm pkg set version="$PACKAGE_VERSION" gitHead="$GITHUB_SHA"
            package_file="$(npm pack --pack-destination dist)"
          fi
          echo "package_path=dist/$package_file" >> "$GITHUB_OUTPUT"

      - name: Publish with provenance
        id: publish
        if: steps.pack.outcome == 'success' && steps.pkg.outputs.published == 'false'
        env:
          PACKAGE_PATH: ${{ steps.pack.outputs.package_path }}
        run: npm publish "$PACKAGE_PATH" --provenance --access public

      - name: Sign tarball and attach GitHub release assets
        # For manually published GitHub releases, keep the signed assets even if npm fails.
        if: ${{ !cancelled() && steps.pack.outcome == 'success' && (success() || (github.event_name == 'release' && steps.publish.outcome == 'failure')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_PATH: ${{ steps.pack.outputs.package_path }}
          RELEASE_TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          sha256sum "$PACKAGE_PATH" > "$PACKAGE_PATH.sha256"
          cosign sign-blob "$PACKAGE_PATH" --bundle "$PACKAGE_PATH.sigstore.json" --yes
          assets=("$PACKAGE_PATH" "$PACKAGE_PATH.sha256" "$PACKAGE_PATH.sigstore.json")
          refs="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          tag_sha="$(awk 'END {print $1}' <<< "$refs")"
          [[ -z "$tag_sha" || "$tag_sha" == "$GITHUB_SHA" ]]
          if gh release view "$RELEASE_TAG" >/dev/null; then
            [[ "$tag_sha" == "$GITHUB_SHA" ]]
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$GITHUB_SHA" --generate-notes
          fi
