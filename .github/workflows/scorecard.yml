name: OpenSSF Scorecard

# Scorecard ran on every push to main, which compounded the per-merge
# Actions bill. The weekly schedule + branch-protection-rule trigger
# keeps the OpenSSF result fresh; `workflow_dispatch` covers ad-hoc
# audits.
on:
  branch_protection_rule:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read

    steps:
      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
