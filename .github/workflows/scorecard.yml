name: OpenSSF Scorecard

# Scorecard ran on every push to main, which compounded the per-merge
# Actions bill. The weekly schedule + branch-protection-rule trigger
# keeps the OpenSSF result fresh; `workflow_dispatch` covers ad-hoc
# audits.
on:
  branch_protection_rule:
  schedule:
    - cron: '25 3 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read

    steps:
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results to Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
