name: CI

# Budget-friendly trigger surface. Branch protection on `main` forces
# all changes through a PR, so PR-time CI is sufficient — post-merge
# `push: main` CI was pure duplication and is dropped here. Run a full
# matrix on-demand via the workflow_dispatch trigger, or weekly via
# `ci-full.yml`.
on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'openspec/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.changeset/**'
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref. Rapid pushes to an agent PR cancel the
# prior run instead of letting both finish on Actions minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node 20)
    # Draft PRs skip CI to save minutes during in-flight agent work.
    # CI auto-fires on `ready_for_review`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install
        run: npm ci --ignore-scripts

      - name: Format new source files (Biome ratchet)
        run: npm run format:check:changed

      - name: Lint (Biome)
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Static and package checks
        run: npm run package:check

      - name: Setup Node for frontend
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci --prefix frontend --ignore-scripts

      - name: Verify frontend
        run: npm --prefix frontend run verify

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix frontend --audit-level=high
