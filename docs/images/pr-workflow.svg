<svg xmlns="http://www.w3.org/2000/svg" width="800" height="536" viewBox="0 0 800 536" role="img" aria-labelledby="title desc">
  <title id="title">A simulated GitGuardex pull request, from worktree to merge</title>
  <desc id="desc">Create a worktree and claim files. Open a GitHub pull request. A high-severity finding blocks the merge. Optional autofix patches the issue and runs review again. Clean review and passing required checks allow a squash merge.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #f0f6fc; }
    .muted { font-size: 18px; fill: #b1bac4; }
    .mono { font-family: monospace; }
    .label { font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    .heading { font-size: 23px; font-weight: 650; }
    .card { fill: #171e27; stroke: #3d4654; }
  </style>
  <rect width="800" height="536" rx="20" fill="#0d1117"/>
  <text x="32" y="36" class="label" style="fill:#7dd3fc">GITGUARDEX · SIMULATED PULL REQUEST #42</text>
  <text x="32" y="72" font-size="31" font-weight="700">Validate checkout input</text>
  <text x="32" y="102" class="muted mono">main ← agent/codex/checkout</text>

  <path d="M40 160V464" fill="none" stroke="#566475" stroke-width="2"/>
  <g fill="#212c3a" stroke="#566475">
    <circle cx="40" cy="160" r="17"/>
    <circle cx="40" cy="256" r="17"/>
    <circle cx="40" cy="352" r="17"/>
    <circle cx="40" cy="464" r="17"/>
  </g>
  <g text-anchor="middle" font-size="17" font-weight="650">
    <text x="40" y="166">1</text>
    <text x="40" y="262">2</text>
    <text x="40" y="358">3</text>
    <text x="40" y="470">4</text>
  </g>

  <rect class="card" x="72" y="127" width="696" height="77" rx="12"/>
  <text class="heading" x="92" y="158">Start in an isolated worktree</text>
  <text class="muted" x="92" y="185">Claim <tspan class="mono">src/checkout.ts</tspan> before editing.</text>

  <rect class="card" x="72" y="223" width="696" height="77" rx="12"/>
  <text class="heading" x="92" y="254">Open a GitHub pull request</text>
  <text class="muted" x="92" y="281">Push the task branch and open the PR against main.</text>

  <rect class="card" x="72" y="319" width="696" height="93" rx="12"/>
  <rect x="609" y="333" width="141" height="29" rx="14" fill="#42212b"/>
  <text class="label" x="679.5" y="352" text-anchor="middle" style="fill:#ffb3b3">BLOCKED</text>
  <text class="heading" x="92" y="350">Review finds a high-severity bug</text>
  <text class="muted" x="92" y="376">Empty input reaches checkout · <tspan class="mono">src/checkout.ts:42</tspan></text>
  <text class="muted" x="92" y="398">Optional autofix → apply a patch → review again.</text>

  <rect class="card" x="72" y="431" width="696" height="77" rx="12"/>
  <rect x="609" y="445" width="141" height="29" rx="14" fill="#203b31"/>
  <text class="label" x="679.5" y="464" text-anchor="middle" style="fill:#9af0b3">MERGED</text>
  <text class="heading" x="92" y="462">Squash-merge the PR</text>
  <text class="muted" x="92" y="489">Clean review + passing required checks → merge, then cleanup.</text>
</svg>
